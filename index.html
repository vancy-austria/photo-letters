<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Letters &mdash; A3 PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Great+Vibes&family=Tangerine:wght@700&family=Playfair+Display:wght@900&family=Abril+Fatface&family=Bodoni+Moda:opsz,wght@6..96,900&family=Titan+One&family=Rammetto+One&family=EB+Garamond:wght@400;500&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="bar">
  <h1>Photo Letters</h1>
  <button id="btnPdf" class="primary">PDF laden</button>
</header>

<main>
  <section class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="zoom">
      <button id="zOut" class="btn small" aria-label="Verkleinern">&minus;</button>
      <span id="zVal">100%</span>
      <button id="zIn" class="btn small" aria-label="Vergrößern">+</button>
      <button id="zReset" class="btn small">Reset</button>
    </div>
    <p class="hint" id="hint">Foto in der Liste <b>doppelt tippen</b> oder auf Buchstaben ziehen. Oder <b>Zufall füllen</b>.</p>
  </section>

  <section class="panel">

    <div id="sel" class="sel" hidden>
      <span id="selName">Foto</span>
      <label class="mini">Größe
        <input id="selSize" type="range" min="4" max="120" value="25">
      </label>
      <button id="selCrop" class="btn small" aria-pressed="false">Zuschneiden</button>
      <label class="mini" id="zoomWrap" hidden>Zoom
        <input id="selZoom" type="range" min="100" max="400" value="100">
      </label>
      <button id="selFront" class="btn small">Nach vorn</button>
      <button id="selDel" class="btn small danger">Entfernen</button>
    </div>

    <div id="photos" class="photos" aria-label="Foto Liste"></div>

    <div class="btns">
      <label class="btn file">Fotos wählen
        <input id="file" type="file" accept="image/*" multiple hidden>
      </label>
      <button id="btnFill" class="btn" hidden>Zufall füllen</button>
      <button id="btnClear" class="btn" hidden>Fotos aus Text leeren</button>
    </div>

    <div class="row">
      <label>Zeile 1
        <input id="line1" type="text" value="Thank you" autocomplete="off">
      </label>
      <select id="font1" class="fontsel" aria-label="Schrift Zeile 1">
        <option value="Pinyon Script">Pinyon Script</option>
        <option value="Great Vibes">Great Vibes</option>
        <option value="Tangerine">Tangerine</option>
      </select>
    </div>

    <div class="row">
      <label>Zeile 2 (mit Fotos)
        <input id="line2" type="text" value="COACH" autocomplete="off">
      </label>
      <select id="font2" class="fontsel" aria-label="Schrift Zeile 2">
        <option value="Playfair Display">Playfair</option>
        <option value="Bodoni Moda">Bodoni</option>
        <option value="Abril Fatface">Abril</option>
        <option value="Titan One">Titan One</option>
        <option value="Rammetto One">Rammetto One</option>
      </select>
    </div>

    <div class="row">
      <label>Zeile 3
        <input id="line3" type="text" value="for all the amazing memories" autocomplete="off">
      </label>
      <select id="font3" class="fontsel" aria-label="Schrift Zeile 3">
        <option value="EB Garamond">EB Garamond</option>
        <option value="Cormorant Garamond">Cormorant</option>
      </select>
    </div>

    <div class="row quality">
      <label class="toggle" title="Format">
        <span>Querformat</span>
        <input id="orient" type="checkbox" role="switch" aria-label="Hochformat">
        <i></i>
        <span>Hochformat</span>
      </label>
      <label>PDF Qualität
        <select id="dpi">
          <option value="150">150 dpi (klein)</option>
          <option value="200" selected>200 dpi</option>
          <option value="300">300 dpi (groß)</option>
        </select>
      </label>
    </div>

  </section>
</main>

<div id="ghost" class="ghost" hidden></div>
<div id="busy" class="busy" hidden><span>PDF wird gebaut …</span></div>

<script src="app.js?v=5"></script>
</body>
</html>
